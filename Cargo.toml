[workspace]
members = ["crates/core", "crates/definitions", "crates/store", "crates/server", "crates/test-support", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
schemars = "1.0"
sha2 = "0.10"
oci-spec = { version = "0.10", default-features = false, features = ["distribution"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
