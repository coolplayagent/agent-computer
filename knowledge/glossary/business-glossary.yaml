schema_version: 1
domains:
  - id: agent-infrastructure
    name: 人与 Agent 电脑基础设施
    description: 本项目领域术语；映射含设计与已实现领域规则，运行服务和基础设施尚待实现。
terms:
  - id: sandbox-process-supervisor
    domain: agent-infrastructure
    canonical_name: SandboxProcessSupervisor
    definition: 无控制凭据的隔离容器中一次性 PID 1，执行结构化 argv、限制输出并清理后代；本地报告不授予执行权限或释放写租约，监督器暂停和运行时故障仍需可信外部 watchdog 与 fencing。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/sandbox/src/supervisor.rs
      - relation: represented_by
        target_kind: file
        target: crates/sandbox/tests/component.py
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/22-sandbox-supervisor.md
  - id: candidate-file-gateway
    domain: agent-infrastructure
    canonical_name: CandidateFileGateway
    definition: 显式配置的有界文件 HTTP 入口；原凭据连接及独立 Computer/Workspace grant 控制读写，读取前后重查授权，保存消费持久派发，超时不释放仍在运行任务的 IO 名额。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/files.rs
      - relation: represented_by
        target_kind: file
        target: crates/worker/src/files/gateway.rs
      - relation: represented_by
        target_kind: file
        target: crates/server/src/files.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/21-file-http-gateway.md
  - id: candidate-file-save
    domain: agent-infrastructure
    canonical_name: CandidateFileSave
    definition: 消费单次写入许可并核对旧内容版本的有界原子文件保存；文件/目录同步读回与有效授权分别核验，未知 IO 不产生排空证明，不替代任意进程 fencing 或 Artifact 发布。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/storage/src/files.rs
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/writers/files.rs
      - relation: represented_by
        target_kind: file
        target: crates/worker/src/files.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/20-bounded-file-saves.md
  - id: candidate-writer-lease
    domain: agent-infrastructure
    canonical_name: CandidateWriterLease
    definition: 绑定原凭据连接、当前 generation/Candidate 及准备收据的持久化修改所有权；单调 epoch 与派发日志约束交接，仅零派发或封闭文件执行排空证明可释放，过期或撤权不等于实际写入停止。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/writers/mod.rs
      - relation: represented_by
        target_kind: file
        target: crates/store/migrations/0010_candidate_writer_leases.sql
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/19-candidate-writer-leases.md
  - id: candidate-preparation
    domain: agent-infrastructure
    canonical_name: CandidatePreparation
    definition: 绑定已提交 Workspace 输入、实际 Volume 身份与写入身份的持久化文件准备；过期派发只观察原发布路径，确认配额/inode/收据后原子标记 Prepared，不等于写入租约、fencing 或 Computer Ready。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/preparation.rs
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/inputs.rs
      - relation: represented_by
        target_kind: file
        target: crates/worker/src/candidate.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/17-candidate-preparation-worker.md
  - id: computer-start-admission
    domain: agent-infrastructure
    canonical_name: ComputerStartAdmission
    definition: 在同一数据库事务内校验独立运行授权、固定规格图、分配 generation/Candidate 并预留容量的持久化排队请求；可取消未派发请求，不代表输入已选择、存储准备、修改租约或运行 Ready。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/start/mod.rs
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/start/graph.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/16-start-admission.md
  - id: runtime-grant
    domain: agent-infrastructure
    canonical_name: RuntimeGrant
    definition: 组织内主体对精确资源 ID 的独立运行权限，与凭据 scope 取交集；权限及关联资源不自动继承，激活上限不等于预算预留、修改租约或停止证明。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/mod.rs
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/types.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/15-runtime-authorization.md
  - id: retained-volume-provisioning
    domain: agent-infrastructure
    canonical_name: VolumeProvisioning
    definition: 经当前权限与派发准入，将首版 Retain Volume 意图供应为固定 JuiceFS CSI PVC/PV，并不可变记录实际 UID；绑定只证明供应，不代表配额生效、Workspace 就绪或物理 fencing。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/worker/src/lib.rs
      - relation: represented_by
        target_kind: file
        target: crates/kubernetes/src/volume.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/13-volume-provisioning.md
  - id: reconciliation-lease
    domain: agent-infrastructure
    canonical_name: ReconcileLease
    definition: 可信协调 worker 在数据库时钟下领取的限时资源意图租约；单调 epoch 拒绝旧 worker 的权威写回，不能证明外部进程终止或替代 Computer generation。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/reconciliation/claims.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/11-reconciliation-coordination.md
  - id: reconciliation-effect-receipt
    domain: agent-infrastructure
    canonical_name: EffectReceipt
    definition: 可信后端适配器核验后提交的固定 step/资源/revision/spec digest、实际对象 UID 与证据引用；数据库只验证绑定和原子持久化，不从回执字符串推断运行事实。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/reconciliation/completion.rs
  - id: definition-plan
    domain: agent-infrastructure
    canonical_name: DefinitionPlan
    definition: 绑定认证主体、组织、准确 diff、依赖版本、排空要求、摘要和有效期的不可变声明计划；规划不发布资源，首次 apply 重新核验权限与版本。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/plans/build.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/10-plans-and-apply.md
  - id: resource-spec-version
    domain: agent-infrastructure
    canonical_name: SpecVersion
    definition: 稳定资源身份下只追加的声明规格版本，保存解析后的规格及固定依赖 revision/digest；与运行实例 generation 分离，未变规格保留原版本。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/migrations/0003_definition_plans.sql
  - id: reconcile-intent
    domain: agent-infrastructure
    canonical_name: ReconcileIntent
    definition: 与定义版本、operation、幂等回执和事件同事务提交的协调意图，指定资源版本及排空要求；Pending 只表示已排队，不能作为运行成功证据。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/plans/apply.rs
  - id: service-credential
    domain: agent-infrastructure
    canonical_name: ServiceCredential
    definition: 服务端生成、按组织和主体绑定的可撤销限时 bearer 凭据，仅持久保存摘要；API scope 不等于资源 grant、连接或控制租约。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/auth.rs
      - relation: represented_by
        target_kind: file
        target: crates/store/migrations/0002_service_credentials.sql
  - id: declaration-registry-version
    domain: agent-infrastructure
    canonical_name: DeclarationRegistryVersion
    definition: 按组织和文档名保存的不可变 ComputerSet 提交版本；授权 apply 以根 metadata.expectedRevision 约束声明版本，并分别检查资源版本；内部 record 另收前置条件，声明持久化本身不等于运行调度。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/store/src/types.rs
      - relation: represented_by
        target_kind: file
        target: crates/store/migrations/0001_declaration_registry.sql
  - id: computer-set
    domain: agent-infrastructure
    canonical_name: ComputerSet
    definition: 组合提交独立资源声明的传输文档；本地静态验证不授予权限，服务端计划仍须解析组织内引用并绑定 revision。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: crates/definitions/src/model.rs
      - relation: represented_by
        target_kind: file
        target: schemas/computer-set-v1alpha1.json
  - id: computer
    domain: agent-infrastructure
    canonical_name: Computer
    definition: 人与 Agent 可连接和操作的稳定电脑身份，组合持久 Workspace、可替换 Sandbox 与 App；链接不随重建改变，人的使用不依赖 Agent 或 workflow。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
      - relation: represented_by
        target_kind: file
        target: crates/core/src/computer.rs
  - id: sandbox
    domain: agent-infrastructure
    canonical_name: Sandbox
    definition: 提供进程、资源和网络隔离的执行域；运行实例与持久存储生命周期独立。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
      - relation: represented_by
        target_kind: file
        target: crates/kubernetes/src/plan.rs
  - id: workspace
    domain: agent-infrastructure
    canonical_name: Workspace
    definition: Computer 服务拥有的长期授权协作范围，包含可修改工作文件、候选修改与成果版本，不等于 workflow attempt workspace。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: artifact
    domain: agent-infrastructure
    canonical_name: Artifact
    definition: 已提交的不可变成果版本，由内容字节、哈希、清单、权限及生产执行引用共同确定。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: candidate
    domain: agent-infrastructure
    canonical_name: Candidate
    definition: 绑定输入版本和执行代次的独立可写工作目录，提交前排空写入并封存。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
      - relation: represented_by
        target_kind: file
        target: crates/storage/src/model.rs
      - relation: represented_by
        target_kind: file
        target: crates/storage/src/materialize.rs
  - id: execution
    domain: agent-infrastructure
    canonical_name: Execution
    definition: 一次受控工具或环境操作的持久记录，拥有状态、输入和结果，但不等于业务 Task。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
      - relation: represented_by
        target_kind: file
        target: crates/core/src/execution.rs
  - id: checkpoint
    domain: agent-infrastructure
    canonical_name: Checkpoint
    definition: 已提交的环境恢复状态清单，引用工作文件和应用状态，不包含任意进程内存恢复承诺。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: connection-session
    domain: agent-infrastructure
    canonical_name: ConnectionSession
    definition: 人或 Agent 主体与 Computer 的有时效、可撤销授权连接；AgentSpec 可选，连接不自动取得修改或页面控制权，也不拥有 Computer 生命周期。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
      - relation: represented_by
        target_kind: file
        target: crates/store/src/runtime/connections/mod.rs
      - relation: represented_by
        target_kind: file
        target: docs/zh-CN/18-connection-sessions.md
  - id: generation
    domain: agent-infrastructure
    canonical_name: Generation
    definition: 环境或控制权的执行代次，用于拒绝旧实例、旧拥有者和迟到回执的权威更新。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
      - relation: represented_by
        target_kind: file
        target: crates/core/src/identity.rs
  - id: fencing
    domain: agent-infrastructure
    canonical_name: Fencing
    definition: 在转移执行权前使旧执行者失去实际操作能力；数据库租约过期或 Pod 对象删除本身不足以证明完成。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
      - relation: represented_by
        target_kind: file
        target: crates/core/src/lease.rs
  - id: harness
    domain: agent-infrastructure
    canonical_name: Harness
    definition: 维护模型循环、上下文、规划与业务动作决策的上层执行框架，通过 Computer 工具接口操作环境。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: app
    domain: agent-infrastructure
    canonical_name: App
    definition: 具有独立定义、实例、状态、健康与操作驱动的应用资源，首版内置 Browser 和 WebApplication，人可直接启动并操作授权应用。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: principal
    domain: agent-infrastructure
    canonical_name: Principal
    definition: 服务端从组织身份或服务凭据确定的人或 Agent 授权主体；客户端声明的身份和链接不直接授予资源权限。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: viewer-session
    domain: agent-infrastructure
    canonical_name: ViewerSession
    definition: 从属于 ConnectionSession、绑定应用实例代次的画面及输入传输会话；输入另需控制租约，断流不证明在途动作已停止。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: computer-view
    domain: agent-infrastructure
    canonical_name: ComputerView
    definition: 人的日常电脑界面，独立认证链接与嵌入共用权限和能力，支持应用、浏览器、文件、成果及控制交接；不另建资源权威状态。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: presentation
    domain: agent-infrastructure
    canonical_name: Presentation
    definition: 固定 ArtifactVersion 的可运行描述，绑定 AppSpec、入口、健康、数据策略、授权与预算；复用 AppInstance 运行，默认试用状态独立，保存产生新成果版本。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: context-binding
    domain: agent-infrastructure
    canonical_name: ContextBinding
    definition: 可信宿主会话与 Computer/Workspace 的版本化绑定，声明个人、共享或临时用途及成员权威；消息和绑定引用本身不授予执行权限。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agentic-runtime-contracts.md
  - id: action-intent
    domain: agent-infrastructure
    canonical_name: ActionIntent
    definition: 执行前固定动作输入、目标、环境代次和策略版本的意图记录，用于预检和匹配有效许可；意图创建不执行副作用。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agentic-runtime-contracts.md
  - id: approval-receipt
    domain: agent-infrastructure
    canonical_name: ApprovalReceipt
    definition: 由许可权威签发、可核验且可撤销的动作许可回执，绑定意图、输入版本、范围与有效期；不替代资源授权、控制租约或执行结果。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agentic-runtime-contracts.md
  - id: environment-version
    domain: agent-infrastructure
    canonical_name: EnvironmentVersion
    definition: 固定运行镜像、驱动、依赖和策略版本的不可变环境配置清单，用于接续、证据和兼容认证；不是运行中内存快照。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agentic-runtime-contracts.md
  - id: handoff-manifest
    domain: agent-infrastructure
    canonical_name: HandoffManifest
    definition: 按当前权限生成的环境事实交接清单，包含代次、版本、执行状态与事件游标，注明观测或检查点一致性及缺口；不是授权令牌。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agentic-runtime-contracts.md
  - id: execution-evidence-bundle
    domain: agent-infrastructure
    canonical_name: ExecutionEvidenceBundle
    definition: 按对象、范围与用途授权导出的执行事实和来源清单，区分环境结果、外部业务验收与完整性；默认仅元数据和受控引用，不自动用于训练。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agentic-runtime-contracts.md
  - id: evaluation-episode
    domain: agent-infrastructure
    canonical_name: EvaluationEpisode
    definition: 后续可选的隔离评测回合，固定环境和 fixture，提供重置、步骤、独立验证与关闭契约；不包含策略训练或生产账户。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agentic-runtime-contracts.md
  - id: team
    domain: agent-infrastructure
    canonical_name: Team
    definition: 外部产品或 Harness 拥有的长期成员、能力与策略组织；团队成员不自动成为 Workspace 成员，不授予 Computer、profile 或凭据权限。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: task-group
    domain: agent-infrastructure
    canonical_name: TaskGroup
    definition: 外部 Harness 围绕本次目标组织的临时参与者、角色、依赖和验收约定，可使用零到多台 Computer；接入 workflow 时关联其 Task/attempt，不另建业务终态。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/agent-computer.md
  - id: collaboration-session
    domain: agent-infrastructure
    canonical_name: CollaborationSession
    definition: relay-teams 或 Harness 拥有的有范围消息、参与者路由与协作接续记录；区别于 Computer 的 ConnectionSession，消息收到或处理完成不表示业务验收通过。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/ecosystem-integration.md
  - id: ecosystem-composition
    domain: agent-infrastructure
    canonical_name: EcosystemComposition
    definition: 本仓库定义、集成宿主解析的可选组件组合与版本化配置，关联服务、适配器、环境和固定成果；不是 ComputerSet 或业务流程引擎，不接管组件权威与部署生命周期。
    language: zh-CN
    mappings:
      - relation: represented_by
        target_kind: file
        target: codespec/design/ecosystem-integration.md
