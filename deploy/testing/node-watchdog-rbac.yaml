# Additional read-only binding for the single-node watchdog component fixture.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ac-node-watchdog-observer
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [ac-component-node]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ac-node-watchdog-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ac-node-watchdog-observer
subjects:
  - kind: ServiceAccount
    name: ac-adapter
    namespace: ac-kube-component
